spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8282/realms/slottify
  datasource:
    url: jdbc:postgresql://localhost:25432/slottify
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  sql:
    init:
      mode: always

keycloak:
  server-url: http://localhost:8282
  realm: slottify
  admin:
    username: admin
    password: admin
    client-id: slottify-client

