version: "3.9"

services:

  slottify-db:
    image: postgres:15.2
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: slottify
    ports:
      - 25432:5432
    volumes:
      - slottify-db-vol:/var/lib/postgresql/data


volumes:
  slottify-db-vol:
    driver: local